<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Reset Password DocuRapi</title>

    <link
        rel="stylesheet"
        href="/static/notification_center.css"
    >

    <script src="/static/security_client.js"></script>
    <link rel="stylesheet" href="/static/docurapi_ui_shell.css">
</head>

<body class="reset-page">
    <main class="reset-container">
        <article class="card reset-card">
            <a href="/" class="reset-brand">
                DocuRapi
            </a>

            <h1>Atur Ulang Password</h1>

            <p>
                Masukkan password baru untuk akun Anda.
            </p>

            <form id="reset-password-form">
                <input
                    id="reset-token"
                    type="hidden"
                    name="token"
                >

                <label>
                    <span>Password baru</span>

                    <input
                        type="password"
                        name="new_password"
                        minlength="8"
                        required
                        autocomplete="new-password"
                    >
                </label>

                <label>
                    <span>Ulangi password</span>

                    <input
                        type="password"
                        name="confirmation"
                        minlength="8"
                        required
                        autocomplete="new-password"
                    >
                </label>

                <button type="submit">
                    Simpan Password Baru
                </button>
            </form>

            <div
                id="reset-message"
                class="message hidden"
            ></div>
        </article>
    </main>

    <script src="/static/reset_password.js"></script>

    <a
        class="notification-center-launch"
        href="/notifications"
        aria-label="Notification Center"
    >
        Notifikasi
    </a>

    <script src="/static/notification_client.js"></script>


    <script src="/static/billing_launcher.js"></script>


    <script src="/static/billing_enforcement_client.js"></script>

    <script src="/static/docurapi_ui_shell.js"></script>
</body>
</html>
