services:
  docurapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docurapi-app
    restart: unless-stopped
    ports:
      - "${DOCURAPI_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      DOCURAPI_DEV_MODE: "1"
      DOCURAPI_PAYMENT_MODE: "simulation"
    volumes:
      - docurapi_storage:/app/storage
      - docurapi_logs:/app/logs

volumes:
  docurapi_storage:
  docurapi_logs:
