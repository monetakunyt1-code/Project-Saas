services:
  docurapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docurapi-app
    restart: unless-stopped
    ports:
      - "${DOCURAPI_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      DOCURAPI_DEV_MODE: "1"
      DOCURAPI_PAYMENT_MODE: "manual_qris_whatsapp"
      DOCURAPI_PUBLIC_BASE_URL: "http://127.0.0.1:8000"
      DOCURAPI_MERCHANT_NAME: "DocuRapi Merchant"
      DOCURAPI_ADMIN_WHATSAPP: "${DOCURAPI_ADMIN_WHATSAPP:-}"
      DOCURAPI_ADMIN_APPROVAL_SECRET: "${DOCURAPI_ADMIN_APPROVAL_SECRET:-dev-admin-secret-change-me}"
      DOCURAPI_QRIS_STATIC_IMAGE_URL: "/static/payment/qris-shopee.png"
    volumes:
      - docurapi_storage:/app/storage
      - docurapi_logs:/app/logs

volumes:
  docurapi_storage:
  docurapi_logs:
