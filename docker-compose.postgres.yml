services:
  postgres:
    image: postgres:16-bookworm

    container_name: docurapi-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: docurapi
      POSTGRES_USER: docurapi
      POSTGRES_PASSWORD: ${DOCURAPI_POSTGRES_LOCAL_PASSWORD:-docurapi_local_only_ChangeMe_2026}

    ports:
      - "127.0.0.1:${DOCURAPI_POSTGRES_PORT:-55432}:5432"

    volumes:
      - docurapi_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U docurapi -d docurapi
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


volumes:
  docurapi_postgres_data:
